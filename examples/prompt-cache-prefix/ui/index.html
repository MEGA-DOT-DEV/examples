<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt cache prefix</title>
  <script src="../../kit/theme.js"></script>
  <link rel="stylesheet" href="../../kit/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mx-page">
    <header class="mx-section-head">
      <h2 class="mx-h3">Keep the prefix steady</h2>
      <p>Each run sends 7 turns with a steady prefix and 7 turns with the change you pick.</p>
    </header>

    <section class="mx-panel mx-settings" aria-label="Settings">
      <div class="mx-fields">
        <div class="mx-field">
          <label class="mx-label" for="mode">Change to compare</label>
          <select id="mode" class="mx-select"></select>
          <p class="mx-hint" id="does"></p>
        </div>
      </div>
      <div class="mx-actions"><div id="picker"></div><button id="run" type="button" class="mx-btn mx-btn--primary">Run</button></div>
    </section>

    <div id="notice"></div>

    <section class="mx-stack" aria-live="polite">
      <div class="mx-section-head">
        <h3 class="mx-h3">Cache use per turn</h3>
        <p id="summary"></p>
      </div>
      <div class="mx-callout" id="verdict" hidden><b id="verdict-title"></b><p id="verdict-text"></p></div>
      <div class="mx-table-wrap" id="table-box" hidden>
        <table class="mx-table cache-table">
          <thead><tr><th class="num">Turn</th><th>Version</th><th>Cache</th><th>Tokens reused</th><th class="num">Cost</th><th class="num">Time</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="mx-stack" id="details"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
