<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Did the track play?</title>
  <script src="../../kit/theme.js"></script>
  <link rel="stylesheet" href="../../kit/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mx-page">
    <section class="mx-panel mx-settings">
      <div class="mx-section-head">
        <h2 class="mx-h3">Does status 200 mean the track plays?</h2>
        <p>The music service returns 200 for every play command. In 3 of 8 requests, the speaker holds playback and nothing plays.</p>
      </div>
      <div class="mx-fields">
        <div class="mx-field">
          <label for="mode" class="mx-label">Tool</label>
          <select id="mode" class="mx-input">
            <option value="trust">Trust the status</option>
            <option value="check">Check the player</option>
          </select>
          <span id="mode-hint" class="mx-hint">play_track sends the command and returns the status code.</span>
        </div>
      </div>
      <div class="mx-actions">
        <div id="picker"></div>
        <button id="run" class="mx-btn mx-btn--primary" type="button">Run 8 requests</button>
      </div>
    </section>
    <div id="notice"></div>
    <section id="result" aria-live="polite">
      <p class="mx-muted">Press Run. About 16 to 24 paid requests, under 1 cent.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
