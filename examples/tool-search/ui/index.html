<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool search</title>
  <script src="../../kit/theme.js"></script>
  <link rel="stylesheet" href="../../kit/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mx-page">
    <header class="mx-section-head">
      <h2 class="mx-h3" id="title">Find one tool in a large catalog</h2>
      <p>The same task runs three times. Each run gives the model the tool schemas in a different way.</p>
    </header>

    <section class="mx-panel mx-settings" aria-label="Settings">
      <div class="mx-fields">
        <div class="mx-field"><label class="mx-label" for="task">Task</label><select id="task" class="mx-select"></select></div>
      </div>
      <div class="mx-actions"><div id="picker"></div><button id="run" type="button" class="mx-btn mx-btn--primary">Run all three</button></div>
    </section>

    <div id="notice"></div>

    <section class="mx-stack" aria-live="polite">
      <div class="mx-section-head">
        <h3 class="mx-h3">Results</h3>
        <p id="summary">Press Run all three. About 7 requests in total, under 1 cent.</p>
      </div>
      <p id="verdict" class="ts-verdict" hidden></p>
      <div class="mx-table-wrap" id="table-box" hidden>
        <table class="mx-table">
          <thead><tr><th>Method</th><th class="num">Schemas sent</th><th class="num">Requests</th><th class="num">Input tokens</th><th class="num">Cost</th><th>Result</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="runs" class="mx-stack"></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
