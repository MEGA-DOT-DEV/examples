<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Should this feature exist?</title>
  <script src="../../kit/theme.js"></script>
  <link rel="stylesheet" href="../../kit/kit.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mx-page">
    <section class="mx-panel mx-settings">
      <div class="mx-section-head">
        <h2 class="mx-h3">Choose what to keep</h2>
        <p class="mx-muted">The same ten features, with and without business context.</p>
      </div>
      <div class="mx-fields">
        <div class="mx-field">
          <label class="mx-label" for="runs">Runs per mode</label>
          <select id="runs" class="mx-input">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
          <span class="mx-hint">Repeated answers show whether the decision holds.</span>
        </div>
      </div>
      <div class="mx-actions">
        <div id="picker"></div>
        <button id="run" class="mx-btn mx-btn--primary" type="button">Run both modes</button>
      </div>
    </section>
    <div id="notice"></div>
    <section id="result" aria-live="polite">
      <p class="mx-muted">Press Run. Six paid requests, usually under 1 cent.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
